<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tabla periódica</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3b5bdb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tabla periódica">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{
  --bg:#f7f7f5;--fg:#1d1d1f;--mut:#6b6b70;--card:#ffffff;--bd:#e2e2e0;--acc:#3b5bdb;
  --a:#ff8a80;--t:#ffd180;--d:#90caf9;--p:#a5d6a7;--m:#ce93d8;--n:#80deea;
  --h:#fff59d;--g:#b39ddb;--l:#f8bbd0;--c:#ffab91;
}
:root[data-theme="dark"]{
  --bg:#161618;--fg:#f2f2f4;--mut:#9a9aa2;--card:#222226;--bd:#38383e;--acc:#8ca4ff;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top,0px) 14px env(safe-area-inset-bottom,0px);
}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 8px}
h1{font-size:22px;margin:0}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--bd);padding:4px;border-radius:12px}
.tab,.mbtn{
  border:0;background:transparent;color:var(--fg);font:inherit;font-size:14px;
  padding:8px 14px;border-radius:9px;cursor:pointer
}
.tab.on,.mbtn.on{background:var(--acc);color:#fff}
section{display:none}
section.on{display:block}
.wrap{overflow-x:auto;padding:8px 2px 14px;-webkit-overflow-scrolling:touch}
.grid{
  display:grid;gap:3px;min-width:600px;width:100%;
  grid-template-columns:repeat(18,minmax(0,1fr));
  grid-template-rows:repeat(7,auto) 10px auto auto;
}
.cell{
  all:unset;box-sizing:border-box;cursor:pointer;border-radius:6px;padding:2px 1px;aspect-ratio:1/1.12;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#1d1d1f;text-align:center;overflow:hidden;
}
.cell:hover{outline:2px solid var(--acc)}
.cell:focus-visible{outline:3px solid var(--acc)}
.cell.sel{outline:3px solid var(--fg)}
.num{font-size:clamp(7px,1.4vw,9px);opacity:.7}
.sym{font-size:clamp(10px,2.4vw,17px);font-weight:700;line-height:1.1}
.nm{font-size:8px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ph{display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--mut)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--mut);margin:10px 2px 0}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.detail{
  margin-top:14px;background:var(--card);border:1px solid var(--bd);border-radius:14px;
  padding:18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;max-width:620px
}
.dsym{width:96px;height:96px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:44px;font-weight:800;color:#1d1d1f;flex-shrink:0}
.detail h2{margin:0 0 4px;font-size:22px}
.mut{color:var(--mut);font-size:14px;margin:0}
dl{display:grid;grid-template-columns:auto auto;gap:4px 16px;margin:10px 0 0;font-size:14px}
dt{color:var(--mut)} dd{margin:0;font-weight:600}
.card{
  background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;
  max-width:560px;margin:8px 0
}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
select{font:inherit;font-size:14px;padding:7px 10px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}
.stats{font-size:14px;color:var(--mut);margin-bottom:12px}
.q{min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.qsym{font-size:76px;font-weight:800;line-height:1}
.qname{font-size:34px;font-weight:700}
.qsub{font-size:13px;color:var(--mut);margin-top:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{
  padding:14px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);
  color:var(--fg);font:inherit;font-size:16px;cursor:pointer;min-height:54px
}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok{background:#2e7d32;color:#fff;border-color:#2e7d32}
.opt.bad{background:#c62828;color:#fff;border-color:#c62828}
.feedback{min-height:24px;margin:12px 0 4px;font-size:15px;font-weight:600}
.next{
  margin-top:8px;border:0;background:var(--acc);color:#fff;font:inherit;font-size:15px;
  padding:10px 18px;border-radius:10px;cursor:pointer;display:none
}
.next.show{display:inline-block}
@media (max-width:700px){ .nm{display:none} }
@media (max-width:520px){
  .opts{grid-template-columns:1fr}
  .qname{font-size:28px}
  .qsym{font-size:60px}
  .detail{justify-content:center;text-align:center}
  .dsym{width:80px;height:80px;font-size:36px}
}
</style>
</head>
<body>

<header>
  <h1>Tabla periódica</h1>
  <div class="tabs">
    <button class="tab" id="themeBtn" aria-label="Cambiar tema">🌙</button>
    <button class="tab on" data-tab="explore">Explorar</button>
    <button class="tab" data-tab="practice">Practicar</button>
  </div>
</header>

<section id="explore" class="on">
  <div class="wrap">
    <div class="grid" id="grid">
      <div class="ph" style="grid-column:3;grid-row:6">57–71</div>
      <div class="ph" style="grid-column:3;grid-row:7">89–103</div>
    </div>
  </div>
  <div class="legend">
    <span><i style="background:var(--a)"></i>Alcalino</span>
    <span><i style="background:var(--t)"></i>Alcalinotérreo</span>
    <span><i style="background:var(--d)"></i>Transición</span>
    <span><i style="background:var(--p)"></i>Postransición</span>
    <span><i style="background:var(--m)"></i>Metaloide</span>
    <span><i style="background:var(--n)"></i>No metal</span>
    <span><i style="background:var(--h)"></i>Halógeno</span>
    <span><i style="background:var(--g)"></i>Gas noble</span>
    <span><i style="background:var(--l)"></i>Lantánido</span>
    <span><i style="background:var(--c)"></i>Actínido</span>
  </div>
  <div class="detail" id="detail"></div>
</section>

<section id="practice">
  <div class="card">
    <div class="ctrl">
      <button class="mbtn on" data-mode="sym2name">Símbolo → nombre</button>
      <button class="mbtn" data-mode="name2sym">Nombre → símbolo</button>
      <button class="mbtn" data-mode="num2sym">Número → símbolo</button>
    </div>
    <div class="ctrl">
      <select id="catSel">
        <option value="all">Todos los elementos</option>
        <option value="a">Metales alcalinos</option>
        <option value="t">Alcalinotérreos</option>
        <option value="d">Metales de transición</option>
        <option value="p">Metales postransicionales</option>
        <option value="m">Metaloides</option>
        <option value="n">No metales</option>
        <option value="h">Halógenos</option>
        <option value="g">Gases nobles</option>
        <option value="l">Lantánidos</option>
        <option value="c">Actínidos</option>
      </select>
    </div>
    <div class="stats" id="stats"></div>
    <div class="q" id="q"></div>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="fb"></div>
    <button class="next" id="nxt">Siguiente</button>
  </div>
</section>

<script>
const RAW=[
["H","Hidrógeno","n"],["He","Helio","g"],["Li","Litio","a"],["Be","Berilio","t"],["B","Boro","m"],
["C","Carbono","n"],["N","Nitrógeno","n"],["O","Oxígeno","n"],["F","Flúor","h"],["Ne","Neón","g"],
["Na","Sodio","a"],["Mg","Magnesio","t"],["Al","Aluminio","p"],["Si","Silicio","m"],["P","Fósforo","n"],
["S","Azufre","n"],["Cl","Cloro","h"],["Ar","Argón","g"],["K","Potasio","a"],["Ca","Calcio","t"],
["Sc","Escandio","d"],["Ti","Titanio","d"],["V","Vanadio","d"],["Cr","Cromo","d"],["Mn","Manganeso","d"],
["Fe","Hierro","d"],["Co","Cobalto","d"],["Ni","Níquel","d"],["Cu","Cobre","d"],["Zn","Zinc","d"],
["Ga","Galio","p"],["Ge","Germanio","m"],["As","Arsénico","m"],["Se","Selenio","n"],["Br","Bromo","h"],
["Kr","Criptón","g"],["Rb","Rubidio","a"],["Sr","Estroncio","t"],["Y","Itrio","d"],["Zr","Circonio","d"],
["Nb","Niobio","d"],["Mo","Molibdeno","d"],["Tc","Tecnecio","d"],["Ru","Rutenio","d"],["Rh","Rodio","d"],
["Pd","Paladio","d"],["Ag","Plata","d"],["Cd","Cadmio","d"],["In","Indio","p"],["Sn","Estaño","p"],
["Sb","Antimonio","m"],["Te","Telurio","m"],["I","Yodo","h"],["Xe","Xenón","g"],["Cs","Cesio","a"],
["Ba","Bario","t"],["La","Lantano","l"],["Ce","Cerio","l"],["Pr","Praseodimio","l"],["Nd","Neodimio","l"],
["Pm","Prometio","l"],["Sm","Samario","l"],["Eu","Europio","l"],["Gd","Gadolinio","l"],["Tb","Terbio","l"],
["Dy","Disprosio","l"],["Ho","Holmio","l"],["Er","Erbio","l"],["Tm","Tulio","l"],["Yb","Iterbio","l"],
["Lu","Lutecio","l"],["Hf","Hafnio","d"],["Ta","Tántalo","d"],["W","Wolframio","d"],["Re","Renio","d"],
["Os","Osmio","d"],["Ir","Iridio","d"],["Pt","Platino","d"],["Au","Oro","d"],["Hg","Mercurio","d"],
["Tl","Talio","p"],["Pb","Plomo","p"],["Bi","Bismuto","p"],["Po","Polonio","p"],["At","Astato","h"],
["Rn","Radón","g"],["Fr","Francio","a"],["Ra","Radio","t"],["Ac","Actinio","c"],["Th","Torio","c"],
["Pa","Protactinio","c"],["U","Uranio","c"],["Np","Neptunio","c"],["Pu","Plutonio","c"],["Am","Americio","c"],
["Cm","Curio","c"],["Bk","Berkelio","c"],["Cf","Californio","c"],["Es","Einstenio","c"],["Fm","Fermio","c"],
["Md","Mendelevio","c"],["No","Nobelio","c"],["Lr","Lawrencio","c"],["Rf","Rutherfordio","d"],["Db","Dubnio","d"],
["Sg","Seaborgio","d"],["Bh","Bohrio","d"],["Hs","Hassio","d"],["Mt","Meitnerio","d"],["Ds","Darmstadtio","d"],
["Rg","Roentgenio","d"],["Cn","Copernicio","d"],["Nh","Nihonio","p"],["Fl","Flerovio","p"],["Mc","Moscovio","p"],
["Lv","Livermorio","p"],["Ts","Teneso","h"],["Og","Oganesón","g"]
];
const E=RAW.map((x,i)=>({z:i+1,s:x[0],n:x[1],c:x[2]}));
const CAT={a:"Metal alcalino",t:"Alcalinotérreo",d:"Metal de transición",p:"Metal postransicional",
  m:"Metaloide",n:"No metal",h:"Halógeno",g:"Gas noble",l:"Lantánido",c:"Actínido"};

// Posición (columna, fila) en la tabla de 18 columnas; lantánidos/actínidos en filas 9 y 10
function pos(z){
  if(z===1)return[1,1];
  if(z===2)return[18,1];
  if(z<=4)return[z-2,2];
  if(z<=10)return[z+8,2];
  if(z<=12)return[z-10,3];
  if(z<=18)return[z,3];
  if(z<=36)return[z-18,4];
  if(z<=54)return[z-36,5];
  if(z<=56)return[z-54,6];
  if(z<=71)return[z-54,9];
  if(z<=86)return[z-68,6];
  if(z<=88)return[z-86,7];
  if(z<=103)return[z-86,10];
  return[z-100,7];
}
function period(z){
  return z<=2?1:z<=10?2:z<=18?3:z<=36?4:z<=54?5:z<=86?6:7;
}
function block(z){
  if(z===2)return"s";
  if((z>=57&&z<=71)||(z>=89&&z<=103))return"f";
  const col=pos(z)[0];
  return col<=2?"s":col<=12?"d":"p";
}

// ---------- Explorar ----------
const grid=document.getElementById('grid');
const detail=document.getElementById('detail');
E.forEach(e=>{
  const [col,row]=pos(e.z);
  const b=document.createElement('button');
  b.className='cell';
  b.dataset.z=e.z;
  b.style.gridColumn=col;
  b.style.gridRow=row;
  b.style.background=`var(--${e.c})`;
  b.setAttribute('aria-label',`${e.z} ${e.n}`);
  b.innerHTML=`<span class="num">${e.z}</span><span class="sym">${e.s}</span><span class="nm">${e.n}</span>`;
  b.onclick=()=>show(e);
  grid.appendChild(b);
});
function show(e){
  document.querySelectorAll('.cell.sel').forEach(x=>x.classList.remove('sel'));
  document.querySelector(`.cell[data-z="${e.z}"]`).classList.add('sel');
  const isF=block(e.z)==='f';
  const grupo=isF?"—":pos(e.z)[0];
  detail.innerHTML=`
    <div class="dsym" style="background:var(--${e.c})">${e.s}</div>
    <div>
      <h2>${e.n}</h2>
      <p class="mut">${CAT[e.c]}</p>
      <dl>
        <dt>Número atómico</dt><dd>${e.z}</dd>
        <dt>Periodo</dt><dd>${period(e.z)}</dd>
        <dt>Grupo</dt><dd>${grupo}</dd>
        <dt>Bloque</dt><dd>${block(e.z)}</dd>
      </dl>
    </div>`;
}
show(E[0]);

// ---------- Practicar ----------
const MODES={
  sym2name:{q:e=>`<div class="qsym">${e.s}</div><div class="qsub">¿Cómo se llama este elemento?</div>`,a:e=>e.n},
  name2sym:{q:e=>`<div class="qname">${e.n}</div><div class="qsub">¿Cuál es su símbolo?</div>`,a:e=>e.s},
  num2sym:{q:e=>`<div class="qsym">${e.z}</div><div class="qsub">Número atómico: ¿cuál es su símbolo?</div>`,a:e=>e.s}
};
const P={mode:'sym2name',cat:'all',ok:0,tot:0,streak:0,best:0,cur:null,opts:[],done:false};

function shuffle(a){
  const r=a.slice();
  for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}
  return r;
}
function pool(){return P.cat==='all'?E:E.filter(e=>e.c===P.cat);}

function next(){
  const pl=pool();
  const cur=pl[Math.floor(Math.random()*pl.length)];
  const others=shuffle(E.filter(e=>e!==cur)).slice(0,3);
  P.cur=cur;
  P.opts=shuffle([cur,...others]);
  P.done=false;
  render();
}

function render(){
  const M=MODES[P.mode];
  document.getElementById('q').innerHTML=M.q(P.cur);
  const box=document.getElementById('opts');
  box.innerHTML='';
  P.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.textContent=M.a(o);
    b.onclick=()=>answer(i);
    box.appendChild(b);
  });
  document.getElementById('fb').textContent='';
  document.getElementById('nxt').classList.remove('show');
  document.getElementById('stats').textContent=
    `Aciertos: ${P.ok}/${P.tot}  ·  Racha: ${P.streak}  ·  Mejor racha: ${P.best}`;
}

function answer(i){
  if(P.done)return;
  P.done=true;
  P.tot++;
  const chosen=P.opts[i];
  const ok=chosen===P.cur;
  if(ok){P.ok++;P.streak++;P.best=Math.max(P.best,P.streak);}
  else P.streak=0;
  const btns=document.querySelectorAll('.opt');
  P.opts.forEach((o,k)=>{
    if(o===P.cur)btns[k].classList.add('ok');
    else if(k===i)btns[k].classList.add('bad');
    btns[k].disabled=true;
  });
  const fb=document.getElementById('fb');
  fb.textContent=ok?'¡Correcto!':`Era ${P.cur.n} (${P.cur.s}), elemento ${P.cur.z}.`;
  fb.style.color=ok?'#2e7d32':'#c62828';
  document.getElementById('nxt').classList.add('show');
  document.getElementById('stats').textContent=
    `Aciertos: ${P.ok}/${P.tot}  ·  Racha: ${P.streak}  ·  Mejor racha: ${P.best}`;
}

document.getElementById('themeBtn').onclick=e=>{
  const dark=document.documentElement.dataset.theme==='dark';
  document.documentElement.dataset.theme=dark?'light':'dark';
  e.currentTarget.textContent=dark?'🌙':'☀️';
};

document.querySelectorAll('.mbtn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.mbtn').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  P.mode=b.dataset.mode;
  next();
});
document.getElementById('catSel').onchange=e=>{P.cat=e.target.value;next();};
document.getElementById('nxt').onclick=next;

document.addEventListener('keydown',ev=>{
  const tab=document.querySelector('.tab.on').dataset.tab;
  if(tab!=='practice')return;
  if(ev.key>='1'&&ev.key<='4')answer(Number(ev.key)-1);
  if(ev.key==='Enter'&&P.done)next();
});

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===t.dataset.tab));
  if(t.dataset.tab==='practice'&&!P.cur)next();
});
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));}
</script>
</body>
</html>
